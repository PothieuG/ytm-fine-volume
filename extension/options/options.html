<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>YTM Fine Volume</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>YTM Fine Volume</h1>
    <section>
      <h2>Courbe de volume</h2>
      <label for="exponent">
        Exposant <output id="exponent-value"></output>
      </label>
      <input id="exponent" type="range" min="1" max="3" step="0.1" />
      <p class="hint">
        1 = comportement d'origine de YouTube Music. Plus l'exposant est grand, plus le bas du slider
        descend loin sous le minimum d'origine (1 % = −40 dB). Le maximum ne change pas.
      </p>
      <table>
        <thead>
          <tr>
            <th>Volume YTM</th>
            <th>Sans l'extension</th>
            <th>Avec</th>
          </tr>
        </thead>
        <tbody id="preview"></tbody>
      </table>
    </section>

    <section>
      <h2>Réglage fin</h2>
      <label class="check"><input id="wheel" type="checkbox" /> Molette sur la barre du lecteur</label>
      <label class="check"><input id="arrows" type="checkbox" /> Flèches ↑ / ↓</label>
      <label class="check"><input id="osd" type="checkbox" /> Afficher le volume à l'écran</label>
      <label for="step">Pas (en %)</label>
      <input id="step" type="number" min="1" max="10" step="1" />
    </section>

    <script src="../src/defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
