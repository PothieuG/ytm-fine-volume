<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>YTM Fine Volume</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon.svg" alt="" width="22" height="22" />
      <h1>Fine Volume</h1>
      <span id="badge" class="badge" hidden></span>
    </header>

    <section id="player" hidden>
      <div class="volume-row">
        <button id="down" class="round" type="button" title="Baisser" aria-label="Baisser le volume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5z" /></svg>
        </button>
        <label class="volume-value">
          <input id="volume" type="number" min="0" max="100" step="1" aria-label="Volume du lecteur, en %" />
          <span>%</span>
        </label>
        <button id="up" class="round" type="button" title="Monter" aria-label="Monter le volume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" /></svg>
        </button>
      </div>
      <input id="volume-range" type="range" min="0" max="100" step="1" aria-label="Volume du lecteur" />
      <p id="output" class="sub"></p>
    </section>

    <section id="problem" hidden>
      <p id="problem-text"></p>
      <p id="problem-hint" class="sub" hidden>
        En navigation privée, l'extension doit d'abord y être autorisée dans about:addons.
      </p>
      <button id="problem-action" class="pill" type="button" hidden></button>
    </section>

    <details id="settings">
      <summary>Réglages</summary>
      <div class="row">
        <label for="exponent">Courbe</label>
        <input id="exponent" type="range" min="1" max="3" step="0.1" />
        <output id="exponent-value" for="exponent"></output>
      </div>
      <p id="preview" class="sub"></p>
      <div class="row">
        <label for="step">Pas de la molette et des flèches</label>
        <span class="unit"><input id="step" type="number" min="1" max="10" step="1" /> %</span>
      </div>
      <label class="row">
        Molette sur la barre du lecteur
        <input id="wheel" type="checkbox" class="toggle" /><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row">
        Flèches ↑ / ↓
        <input id="arrows" type="checkbox" class="toggle" /><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row">
        Volume affiché sur la page
        <input id="osd" type="checkbox" class="toggle" /><span class="switch" aria-hidden="true"></span>
      </label>
    </details>

    <script src="../src/defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
